    <script>
      // 首帧前定主题，避免暗色用户看到亮色闪一下
      (function () {
        var q = new URLSearchParams(location.search).get('theme')
        var t = q || localStorage.getItem('zs-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        document.documentElement.dataset.theme = t
      })()
    </script>
