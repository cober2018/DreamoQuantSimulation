<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>知数星耀 · A 股盘后数据与每日事实要点</title>
    <meta name="description" content="知数星耀：A 股盘后数据平台。指数与涨跌家数、成交与参与度、行业板块、涨停题材、事件日程，按固定规则整理成可核对的每日统计事实。只给数据，不构成投资建议。" />
    <meta name="theme-color" content="#080e1b" />
    <link rel="icon" href="/brand/zhishu-favicon.png" />
    <link rel="preload" href="/fonts/zx-serif.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      // 先于首帧决定主题，避免闪烁：URL ?theme= > 本地偏好 > 暗色（方向 C 暗色优先）
      (function () {
        var q = new URLSearchParams(location.search).get('theme')
        var t = q === 'light' || q === 'dark' ? q : null
        try { t = t || localStorage.getItem('zx-theme') } catch (e) {}
        document.documentElement.dataset.theme = t === 'light' ? 'light' : 'dark'
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
