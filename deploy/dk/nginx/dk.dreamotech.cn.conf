# dk.dreamotech.cn —— 知数星耀量化平台（DreamoQuantSimulation，对外版）
# 独立文件，不改 dreamotech.cn.conf，不复用 live/dreamotech.cn 证书（derper 依赖那张）。
# 前提：phase 1（dk.dreamotech.cn.http-only.conf）已上线，并用 certbot nginx 插件签出 live/dk.dreamotech.cn（与线上现有证书的续期方式一致）。
# 线上没有 /etc/nginx/snippets，安全头直接写在每个 location 里（location 写了 add_header 就不继承 server 层）。

server {
    listen 80;
    listen [::]:80;
    server_name dk.dreamotech.cn;
    # ACME 验证由 certbot nginx 插件临时注入精确匹配的 location，优先于下面的 301
    location / { return 301 https://dk.dreamotech.cn$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name dk.dreamotech.cn;

    ssl_certificate     /etc/letsencrypt/live/dk.dreamotech.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dk.dreamotech.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /opt/dk-insight/web/current;
    index index.html;
    access_log /var/log/nginx/dk-insight/access.log;
    error_log  /var/log/nginx/dk-insight/error.log warn;
    client_max_body_size 64k;   # 网关只有 JSON 小请求
    server_tokens off;

    # ---- API → insight_api（单实例，只监听本机） ----
    location /api/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # 覆盖而不是追加：防止客户端伪造 X-Forwarded-For 绕过限流/封禁。
        # 网关用 uvicorn --proxy-headers --forwarded-allow-ips=127.0.0.1 读取这个头。
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        # 不加 proxy_cache：响应按用户等级裁剪，并带个人水印。
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self' data:; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header Strict-Transport-Security "max-age=63072000" always;
    }

    # ---- MCP（内部封闭测试，INSIGHT_MCP_ENABLED=1 才有效；关闭时网关回 404） ----
    location = /mcp {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=63072000" always;
    }

    # ---- 前端 SPA ----
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self' data:; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header Strict-Transport-Security "max-age=63072000" always;
    }
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self' data:; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header Strict-Transport-Security "max-age=63072000" always;
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self' data:; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header Strict-Transport-Security "max-age=63072000" always;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
}
